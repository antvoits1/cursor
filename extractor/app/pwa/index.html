<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070605">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Extractor">
  <meta name="description" content="Local mobile corporate intelligence workspace">
  <link rel="manifest" href="/pwa/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/pwa/icons/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
  <title>Intelligence Extractor</title>
</head>
<body data-mode="pwa">
  <div id="app" class="app-shell" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/pwa/service-worker.js', {scope: '/pwa/'}).catch(() => {}));
    }
  </script>
</body>
</html>
